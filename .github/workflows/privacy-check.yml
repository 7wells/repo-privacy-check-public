# File purpose: Scan a caller repository's current tree and the history reachable from its checked-out HEAD.
# Inputs: The caller repository checked out with the complete ancestor history of HEAD.
# Outputs: A failed job when either privacy scan reports findings or cannot complete safely.
# Security and privacy: Use read-only permissions, retain no credentials, and emit metadata-only findings.
# Maintenance invariants: Keep both scans independent and pin the reviewed public runtime to a full SHA.

name: Privacy check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  privacy-check:
    name: Privacy check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Scan current tree
        id: current-scan
        continue-on-error: true
        uses: 7wells/repo-privacy-check-public@4804c7cf21d1a28bbe531c7834702aabb4f6ce0e # HEAD-scoped history implementation
        with:
          target-path: target
          scan-mode: current

      - name: Scan Git history
        id: history-scan
        if: always()
        continue-on-error: true
        uses: 7wells/repo-privacy-check-public@4804c7cf21d1a28bbe531c7834702aabb4f6ce0e # HEAD-scoped history implementation
        with:
          target-path: target
          scan-mode: history
          history-attestations: target/.privacy-history-attestations.json

      - name: Fail if a privacy scan failed
        if: always() && (steps.current-scan.outcome == 'failure' || steps.history-scan.outcome == 'failure')
        run: exit 1
